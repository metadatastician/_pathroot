# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Jekyll Build & Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build Jekyll site
        run: |
          if [ -f "Gemfile" ]; then
            bundle exec jekyll build
          else
            echo "No Gemfile found, skipping Jekyll build"
          fi
    timeout-minutes: 15
permissions:
  contents: read
