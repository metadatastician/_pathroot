# This workflow is managed by gh actions-lock.
on:
  push:
    branches: [main]
  pull_request:

# Estate guardrail: scope push to default branches (PR fires once, not
# push+PR) and cancel superseded runs. Safe — read-only PR check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reject newly added TypeScript and JavaScript
        run: |
          NEW_TS=$(git diff --name-only --diff-filter=A HEAD~1 2>/dev/null | grep -E '\.(ts|tsx)$' | grep -v '\.gen\.' || true)
          NEW_JS=$(git diff --name-only --diff-filter=A HEAD~1 2>/dev/null | grep -E '\.(js|jsx)$' | grep -v '\.res\.js$' | grep -v '\.gen\.' | grep -v 'node_modules' || true)

          if [ -n "$NEW_TS" ] || [ -n "$NEW_JS" ]; then
            echo "❌ New TS/JS files detected. Use  instead."
            [ -n "$NEW_TS" ] && echo "$NEW_TS"
            [ -n "$NEW_JS" ] && echo "$NEW_JS"
            exit 1
          fi
          echo "✅  policy enforced"
