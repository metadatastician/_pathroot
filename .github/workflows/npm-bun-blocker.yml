# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: NPM/Bun Blocker
on:
  push:
    branches: [main]
  pull_request:
# Estate guardrail: scope push to default branches (PR fires once, not
# push+PR) and cancel superseded runs. Safe — read-only PR check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Block npm/pnpm/yarn lockfiles
        run: |
          # Bun is tier 1 as of the 2026-08-26 owner ruling: package.json plus
          # bun.lock are EXPECTED, not anti-patterns. Only the npm/pnpm/yarn
          # lockfiles are rejected.
          if [ -f "package-lock.json" ] || [ -f "pnpm-lock.yaml" ] || [ -f "yarn.lock" ]; then
            echo "❌ npm/pnpm/yarn artifacts detected. Use Bun (package.json + bun.lock) instead."
            exit 1
          fi
          echo "✅ No npm/pnpm/yarn violations"
    timeout-minutes: 15
permissions:
  contents: read
